name: Windows port

# The port in windows/ is .NET and Avalonia and cannot be built by this repository's own verify.yml, which is
# Xcode's. This is the half that keeps it compiling and passing on its own, and it only runs when something
# under windows/ has changed — a change to the Mac app cannot make it red.
on:
  push:
    paths:
      - "windows/**"
      - ".github/workflows/windows.yml"
  pull_request:
    paths:
      - "windows/**"
      - ".github/workflows/windows.yml"
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # Warnings are errors here: this port has been held at zero and a warning is what catches a name that
      # resolved to the wrong member.
      - name: Build
        run: dotnet build Compositor.slnx -warnaserror --nologo

      - name: Test
        run: dotnet test tests/Compositor.Core.Tests/Compositor.Core.Tests.csproj --nologo

      # The window, driven with a pointer. It runs on Avalonia's headless platform, so it needs no display and
      # nothing has to be shown: it builds the real window, clicks it, and fails with a non-zero exit code if
      # anything it asserts does not hold.
      - name: Drive the window with a pointer
        run: dotnet run --project src/Compositor.Desktop/Compositor.Desktop.csproj -- --clicks clicks.png

      # Produce a portable Windows 11 package for people who do not have the .NET SDK installed. The publish is
      # self-contained and includes the native image libraries used by the PSD/RAW importers.
      - name: Publish portable app
        run: >-
          dotnet publish src/Compositor.Desktop/Compositor.Desktop.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          --output dist-app

      - name: Add portable app instructions
        shell: pwsh
        run: |
          @'
          Compositor for Windows 11

          1. Extract this ZIP to a folder.
          2. Double-click Compositor.Desktop.exe.
          3. No .NET installation is required.

          This is the Windows port of Compositor. It follows the macOS 1.3.7 feature set and uses the same .comp
          project format. See https://github.com/adfdsfvb3/Compositor/tree/compositor_win for known differences.
          '@ | Set-Content -Encoding utf8 dist-app\README-Windows.txt

      - name: Zip portable app
        shell: pwsh
        run: Compress-Archive -Path dist-app\* -DestinationPath Compositor-Windows-x64.zip -Force

      - name: Upload portable app
        uses: actions/upload-artifact@v4
        with:
          name: Compositor-Windows-x64
          path: windows/Compositor-Windows-x64.zip
          if-no-files-found: error
